<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Марвел-Дурак</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Russo+One&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:'Oswald',sans-serif;background:#05051a;color:#fff;min-height:100vh;overflow-x:hidden;user-select:none}
#bgLayer{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:radial-gradient(circle at 50% 40%,#1e1e50 0%,#05051a 80%);transition:background .6s}
#bgLayer .stars{position:absolute;inset:-50%;background-image:radial-gradient(1.5px 1.5px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 50px 90px,#fff,transparent),radial-gradient(1.5px 1.5px at 130px 60px,#aaccff,transparent),radial-gradient(1px 1px at 200px 140px,#fff,transparent),radial-gradient(2px 2px at 280px 40px,#ffd700,transparent),radial-gradient(1px 1px at 340px 200px,#fff,transparent),radial-gradient(1.5px 1.5px at 420px 110px,#aaccff,transparent);background-size:500px 300px;animation:sm 60s linear infinite;opacity:.5}
@keyframes sm{to{transform:translate(-500px,-300px)}}
#bgLayer .rays{position:absolute;top:50%;left:50%;width:200vmax;height:200vmax;transform:translate(-50%,-50%);background:repeating-conic-gradient(from 0deg,rgba(255,215,0,.03) 0deg 2deg,transparent 2deg 12deg);animation:rr 120s linear infinite;opacity:.6;transition:opacity .6s}
@keyframes rr{to{transform:translate(-50%,-50%) rotate(360deg)}}
#bgLayer .cityLayer{position:absolute;bottom:0;left:0;right:0;height:60%;background:linear-gradient(180deg,transparent 0%,rgba(0,0,0,.6) 100%),linear-gradient(90deg,#0a0a2a 0 8%,transparent 8% 10%,#0f0f3a 10% 22%,transparent 22% 25%,#0a0a2a 25% 40%,transparent 40% 43%,#12123e 43% 60%,transparent 60% 63%,#0a0a2a 63% 78%,transparent 78% 81%,#0f0f3a 81% 95%,transparent 95%);opacity:0;transition:opacity .6s}
#bgLayer .gridLayer{position:absolute;inset:0;background-image:linear-gradient(rgba(46,204,113,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(46,204,113,.08) 1px,transparent 1px);background-size:40px 40px;opacity:0;transition:opacity .6s}
body.scene-cosmic #bgLayer{background:radial-gradient(ellipse at 20% 30%,rgba(142,68,173,.35) 0%,transparent 45%),radial-gradient(ellipse at 80% 70%,rgba(52,152,219,.30) 0%,transparent 50%),radial-gradient(ellipse at 50% 50%,rgba(199,0,48,.20) 0%,transparent 60%),radial-gradient(circle at 50% 40%,#1e1e50 0%,#05051a 80%)}
body.scene-cosmic #bgLayer .stars{opacity:.8;animation:sm 90s linear infinite,nebulaPulse 12s ease-in-out infinite}
@keyframes nebulaPulse{0%,100%{filter:hue-rotate(0deg) brightness(1)}50%{filter:hue-rotate(30deg) brightness(1.2)}}
body.scene-cosmic #bgLayer .rays{opacity:.4}
body.scene-city #bgLayer{background:linear-gradient(180deg,#0a0a2e 0%,#1a0a3a 40%,#2c1810 70%,#0a0515 100%)}
body.scene-city #bgLayer .cityLayer{opacity:.85;background:linear-gradient(180deg,transparent 0%,rgba(0,0,0,.8) 100%),repeating-linear-gradient(90deg,transparent 0 20px,rgba(255,215,0,.15) 20px 22px,transparent 22px 40px),linear-gradient(90deg,#0a0a2a 0 6%,transparent 6% 7%,#15153a 7% 18%,transparent 18% 19%,#0a0a2a 19% 30%,transparent 30% 32%,#1a1a4a 32% 45%,transparent 45% 47%,#0a0a2a 47% 60%,transparent 60% 62%,#15153a 62% 75%,transparent 75% 77%,#0a0a2a 77% 88%,transparent 88% 90%,#1a1a4a 90% 100%);animation:cityGlow 4s ease-in-out infinite}
@keyframes cityGlow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.3)}}
body.scene-city #bgLayer .stars{opacity:.4}
body.scene-city #bgLayer .rays{opacity:.15}
body.scene-lab #bgLayer{background:radial-gradient(circle at 30% 20%,rgba(46,204,113,.15) 0%,transparent 50%),radial-gradient(circle at 70% 80%,rgba(52,152,219,.12) 0%,transparent 50%),radial-gradient(circle at 50% 40%,#0a1a1a 0%,#020a0a 90%)}
body.scene-lab #bgLayer .gridLayer{opacity:1;background-image:linear-gradient(rgba(46,204,113,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(46,204,113,.12) 1px,transparent 1px);animation:gridScroll 20s linear infinite}
@keyframes gridScroll{0%{background-position:0 0}100%{background-position:40px 40px}}
body.scene-lab #bgLayer .rays{opacity:0}
body.scene-daily #bgLayer{background:radial-gradient(circle at 50% 40%,#151530 0%,#05051a 80%)}
body.scene-daily #bgLayer .rays{opacity:.15}
body.scene-comic #bgLayer{background:radial-gradient(circle at 50% 50%,rgba(255,215,0,.15) 0%,transparent 60%),radial-gradient(circle at 20% 20%,rgba(231,76,60,.20) 0%,transparent 40%),radial-gradient(circle at 80% 80%,rgba(52,152,219,.20) 0%,transparent 40%),radial-gradient(circle at 50% 40%,#2a0a1a 0%,#0a0515 90%)}
body.scene-comic #bgLayer .rays{opacity:.7;background:repeating-conic-gradient(from 0deg,rgba(255,215,0,.06) 0deg 3deg,transparent 3deg 15deg);animation:comicSpin 40s linear infinite}
@keyframes comicSpin{0%{transform:translate(-50%,-50%) rotate(0deg)}100%{transform:translate(-50%,-50%) rotate(360deg)}}
body.scene-comic #bgLayer .stars{opacity:.3;animation:comicPulse 2s ease-in-out infinite}
@keyframes comicPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
body.scene-mystic #bgLayer{background:radial-gradient(circle at 50% 50%,rgba(142,68,173,.25) 0%,transparent 55%),radial-gradient(circle at 50% 50%,rgba(52,152,219,.15) 0%,transparent 70%),radial-gradient(circle at 50% 50%,#1a0a2e 0%,#05051a 90%)}
body.scene-mystic #bgLayer .rays{opacity:.9;background:repeating-conic-gradient(from 0deg,rgba(142,68,173,.10) 0deg 2deg,transparent 2deg 8deg);animation:mysticSpin 30s linear infinite}
@keyframes mysticSpin{0%{transform:translate(-50%,-50%) rotate(0deg) scale(1)}50%{transform:translate(-50%,-50%) rotate(180deg) scale(1.1)}100%{transform:translate(-50%,-50%) rotate(360deg) scale(1)}}
body.scene-mystic #bgLayer .stars{opacity:.6;animation:mysticStars 8s ease-in-out infinite}
@keyframes mysticStars{0%,100%{filter:hue-rotate(0deg) brightness(1)}50%{filter:hue-rotate(60deg) brightness(1.5)}}
#game,#menu{position:relative;z-index:1}
#game{display:flex;flex-direction:column;min-height:100vh;padding:10px;gap:8px}
#topBar{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;gap:8px;flex-wrap:wrap;background:linear-gradient(180deg,rgba(20,20,50,.9),rgba(10,10,30,.7));border-radius:12px;border:1px solid rgba(255,215,0,.15);box-shadow:0 4px 20px rgba(0,0,0,.5)}
.player-info{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:30px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);transition:all .2s}
.player-info.active{background:rgba(255,215,0,.15);border-color:rgba(255,215,0,.5);box-shadow:0 0 20px rgba(255,215,0,.35)}
.player-info.enemy.active{background:rgba(231,76,60,.15);border-color:rgba(231,76,60,.5);box-shadow:0 0 20px rgba(231,76,60,.35)}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(145deg,#333,#111);border:2px solid #ffd70066;display:flex;align-items:center;justify-content:center;font-size:20px;background-size:cover;background-position:center;flex-shrink:0}
.player-info.enemy .avatar{border-color:#e74c3c66}
.pName{font-family:'Russo One',sans-serif;font-size:13px}
.pCount{font-family:'Bangers',cursive;font-size:20px;color:#ffd700;letter-spacing:1px}
.stat{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.05);padding:6px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.06);font-family:'Russo One',sans-serif;font-size:12px}
.stat.gold{color:#ffd700;background:rgba(255,215,0,.1);border-color:rgba(255,215,0,.25)}
.stat.red{color:#ff6b6b;background:rgba(231,76,60,.1);border-color:rgba(231,76,60,.25)}
.stat.online{color:#2ecc71;background:rgba(46,204,113,.1);border-color:rgba(46,204,113,.3)}
.icon-btn{background:rgba(255,255,255,.05);padding:7px 11px;border-radius:8px;color:#aab;cursor:pointer;border:1px solid rgba(255,255,255,.06);font-family:inherit;font-size:13px;transition:all .15s}
.icon-btn:hover{color:#ffd700;background:rgba(255,215,0,.1);border-color:rgba(255,215,0,.3)}
.icon-btn.off{color:#555;text-decoration:line-through;opacity:.6}
#turnIndicator{text-align:center;padding:10px 20px;font-family:'Bangers',cursive;font-size:26px;letter-spacing:3px;border-radius:12px;transition:all .4s;margin:0 auto;min-width:260px;max-width:400px}
#turnIndicator.my{background:linear-gradient(145deg,rgba(255,215,0,.25),rgba(255,215,0,.08));color:#ffd700;text-shadow:0 0 16px rgba(255,215,0,.8);border:2px solid rgba(255,215,0,.5);animation:tpy 2s ease-in-out infinite}
#turnIndicator.enemy{background:linear-gradient(145deg,rgba(231,76,60,.25),rgba(231,76,60,.08));color:#ff6b6b;text-shadow:0 0 16px rgba(231,76,60,.8);border:2px solid rgba(231,76,60,.5);animation:tpr 2s ease-in-out infinite}
#turnIndicator.hidden{display:none}
@keyframes tpy{0%,100%{box-shadow:0 0 20px rgba(255,215,0,.3)}50%{box-shadow:0 0 40px rgba(255,215,0,.6)}}
@keyframes tpr{0%,100%{box-shadow:0 0 20px rgba(231,76,60,.3)}50%{box-shadow:0 0 40px rgba(231,76,60,.6)}}
.hand{display:flex;justify-content:center;align-items:flex-end;gap:4px;flex-wrap:wrap;padding:36px 4px 4px;min-height:200px}
#aiHand{min-height:168px;align-items:flex-start;padding-top:26px}
#tableArea{flex:1;display:flex;justify-content:center;align-items:center;gap:30px;min-height:220px;padding:8px}
#pileWrap{flex:1;display:flex;justify-content:center;align-items:center;min-width:0;min-height:200px}
#pileCards{display:flex;gap:16px;align-items:flex-start;justify-content:center;min-height:200px;flex-wrap:wrap;padding:10px}
.pile-stack{display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.pile-placeholder{color:#2a2a4e;font-size:16px;padding:100px 50px;border:2px dashed #2a2a4e;border-radius:14px;letter-spacing:4px;font-family:'Russo One',sans-serif}
#message{font-family:'Russo One',sans-serif;font-size:15px;text-align:center;color:#ffd700;min-height:46px;max-width:800px;padding:12px 24px;line-height:1.4;margin:0 auto;background:linear-gradient(180deg,rgba(255,215,0,.1),rgba(255,215,0,.03));border-radius:12px;border:1px solid rgba(255,215,0,.25);box-shadow:0 0 24px rgba(255,215,0,.15);letter-spacing:.3px;text-shadow:0 0 12px rgba(255,215,0,.4)}
#tableRight{display:flex;flex-direction:column;align-items:center;gap:12px;flex-shrink:0}
#deckVisual,#discardVisual{width:120px;height:175px;position:relative}
.deck-card{position:absolute;inset:0;border-radius:12px;background:radial-gradient(circle at 50% 30%,rgba(100,150,255,.25) 0%,transparent 60%),repeating-linear-gradient(45deg,#14204e 0,#14204e 10px,#1a2a5e 10px,#1a2a5e 20px);border:2px solid #3498db88;box-shadow:0 0 16px rgba(52,152,219,.4),inset 0 0 30px rgba(0,0,0,.8);display:flex;justify-content:center;align-items:center;transition:opacity .3s}
.deck-card::before{content:'';position:absolute;inset:6px;border-radius:8px;border:1px dashed rgba(52,152,219,.35)}
.deck-card.d1{transform:translate(-2px,-2px);opacity:.65}
.deck-card.d2{transform:translate(-4px,-4px);opacity:.45}
.deck-card.d3{transform:translate(-6px,-6px);opacity:.28}
.deck-card.d4{transform:translate(-8px,-8px);opacity:.14}
.deck-label-top,.discard-label-top{position:absolute;top:9px;left:50%;transform:translateX(-50%);font-size:10px;opacity:.9;letter-spacing:3px;font-family:'Russo One',sans-serif}
.deck-label-top{color:#85c1e9}
.deck-big,.discard-big{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:44px;color:#fff;font-family:'Bangers',cursive;line-height:1;text-shadow:3px 3px 0 #000}
.deck-big{text-shadow:0 0 14px #3498db,0 0 28px rgba(52,152,219,.7),3px 3px 0 #000}
.deck-label,.discard-label{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);font-size:9px;opacity:.7;letter-spacing:3px;font-family:'Russo One',sans-serif}
.deck-label{color:#85c1e9}
.discard-card{position:absolute;inset:0;border-radius:12px;background:radial-gradient(circle at 50% 50%,rgba(231,76,60,.2) 0%,transparent 60%),repeating-linear-gradient(-45deg,#3a1414 0,#3a1414 10px,#4a1a1a 10px,#4a1a1a 20px);border:2px solid #e74c3c88;box-shadow:0 0 16px rgba(231,76,60,.35),inset 0 0 30px rgba(0,0,0,.8);display:flex;justify-content:center;align-items:center}
.discard-label-top{color:#ff8888}
.discard-big{text-shadow:0 0 14px #e74c3c,0 0 28px rgba(231,76,60,.7),3px 3px 0 #000}
.discard-label{color:#ff8888}
/* ===== КАРТОЧКИ 165×232 ===== */
.card{width:165px;height:232px;border-radius:14px;background:linear-gradient(145deg,#1a1a3e,#0d0d24);border:2px solid var(--c1,#444);padding:7px 6px;display:flex;flex-direction:column;font-size:10.5px;position:relative;overflow:hidden;flex-shrink:0;box-shadow:0 4px 14px var(--glow,#0006),inset 0 0 24px rgba(0,0,0,.5);transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .25s;cursor:pointer;transform-origin:center bottom}
.card.mini{width:96px;height:138px;font-size:8px;padding:3px;border-radius:10px}
.card.mini .card-name{font-size:9px;min-height:18px;margin-bottom:2px;padding-top:10px}
.card.mini .attr-row{font-size:7.5px;padding:1px 3px;margin-bottom:1px}
.card.mini .emblem{font-size:22px}
.card.mini .card-zoom{font-size:12px;top:3px;left:3px;padding:1px 3px}
.card.back{background:repeating-linear-gradient(45deg,#1a1a3e 0,#1a1a3e 8px,#2a2a5e 8px,#2a2a5e 16px);justify-content:center;align-items:center;font-size:30px;color:#ffd700;border-color:#ffd70055;cursor:default}
.card.back .aura,.card.back .emblem,.card.back .card-img,.card.back .card-zoom{display:none}
.card .aura{position:absolute;inset:0;pointer-events:none;z-index:0;background:radial-gradient(circle at 50% 50%,var(--c1) 0%,transparent 70%);opacity:.35}
.card .emblem{position:absolute;top:38px;right:6px;font-size:40px;opacity:.16;pointer-events:none;z-index:0;filter:drop-shadow(0 0 6px var(--c2,#fff))}
.card>*:not(.aura):not(.emblem):not(.card-img):not(.card-zoom):not(.card-name){position:relative;z-index:1}
.card-zoom{position:absolute;top:5px;left:5px;font-size:12px;padding:1px 5px;border-radius:5px;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);color:#ffd700;cursor:pointer;z-index:10;opacity:.55;transition:all .15s;border:1px solid rgba(255,215,0,.25)}
.card-zoom:hover{opacity:1;background:rgba(255,215,0,.25);transform:scale(1.15)}
.card-img{position:absolute;inset:0;background-size:cover;background-position:center top;border-radius:13px;z-index:0;opacity:.95;pointer-events:none}
.card.has-img{justify-content:flex-end;overflow:visible;margin-top:26px}
.card.has-img .card-img::after{content:'';position:absolute;inset:0;border-radius:13px;background:linear-gradient(180deg,rgba(0,0,0,.15) 0%,rgba(0,0,0,.1) 40%,rgba(0,0,0,.9) 100%)}
/* ВАРИАНТ A: имя плашкой ВПЛОТНУЮ СВЕРХУ */
.card.has-img .card-name{position:absolute;top:-26px;left:-2px;right:-2px;height:26px;margin:0;padding:0 8px;background:linear-gradient(180deg,rgba(15,15,40,.98),rgba(5,5,20,.95));color:#ffd700;border:2px solid var(--c2,#ffd700);border-bottom:none;border-radius:10px 10px 0 0;font-family:'Bangers',cursive;font-size:14px;font-weight:normal;letter-spacing:1.1px;display:flex;align-items:center;justify-content:center;text-shadow:0 0 6px rgba(255,215,0,.55),1px 1px 0 #000,-1px -1px 0 #000;box-shadow:0 -2px 10px var(--glow,rgba(255,215,0,.25));z-index:5;min-height:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase;line-height:1}
.card.has-img .attr-row{background:rgba(0,0,0,.78)!important;backdrop-filter:blur(2px)}
.card.mini.has-img{margin-top:20px}
.card.mini.has-img .card-name{top:-20px;left:-1px;right:-1px;height:20px;font-size:10px;letter-spacing:.6px;padding:0 5px;border-radius:8px 8px 0 0;border-width:1.5px}
.card.mini.has-img .attr-row{font-size:7px;padding:1px 3px;margin-bottom:1px}
.card:not(.no-tilt):hover{transform:translateY(-12px) scale(1.05) rotate(0)!important;z-index:100}
.fx-float .aura{animation:f1 2.8s ease-in-out infinite}
.fx-tech .aura{animation:f2 2s ease-in-out infinite}
.fx-mystic .aura{animation:f3 3.5s linear infinite}
.fx-lightning .aura{animation:f4 1.8s steps(8) infinite}
.fx-brute .aura{animation:f5 1.6s ease-in-out infinite}
.fx-cosmic .aura{animation:f6 4s linear infinite}
.fx-rage .aura{animation:f7 1.2s ease-in-out infinite}
.fx-symbiote .aura{animation:f8 2.4s ease-in-out infinite}
.fx-shadow .aura{animation:f9 3s ease-in-out infinite}
.fx-shield .aura{animation:f10 3s linear infinite}
@keyframes f1{0%,100%{transform:translateY(0) scale(1);opacity:.3}50%{transform:translateY(-4px) scale(1.1);opacity:.55}}
@keyframes f2{0%,100%{opacity:.3}50%{opacity:.75;filter:brightness(1.6)}}
@keyframes f3{0%{transform:scale(.7) rotate(0);opacity:.2}50%{transform:scale(1.35) rotate(180deg);opacity:.65}100%{transform:scale(.7) rotate(360deg);opacity:.2}}
@keyframes f4{0%,8%{opacity:.15}10%{opacity:.95}12%{opacity:.15}14%{opacity:.95}16%{opacity:.2}100%{opacity:.2}}
@keyframes f5{0%,100%{transform:translate(0,0);opacity:.35}25%{transform:translate(-3px,1px);opacity:.6}75%{transform:translate(3px,-1px);opacity:.6}}
@keyframes f6{0%{transform:rotate(0);opacity:.3}100%{transform:rotate(360deg);opacity:.6}}
@keyframes f7{0%,100%{opacity:.3}50%{opacity:.8;filter:brightness(1.6) saturate(2)}}
@keyframes f8{0%,100%{transform:scale(1) rotate(0);opacity:.35}50%{transform:scale(1.3) rotate(15deg);opacity:.7}}
@keyframes f9{0%,100%{transform:translate(0,0);opacity:.25}50%{transform:translate(4px,-4px);opacity:.6}}
@keyframes f10{0%{transform:rotate(0)}50%{transform:rotate(180deg) scale(1.2)}100%{transform:rotate(360deg)}}
.card.just-played{animation:cb .75s cubic-bezier(.18,.9,.4,1.25)}
@keyframes cb{0%{transform:translateY(240px) scale(.4) rotate(-18deg);opacity:0;filter:brightness(3.5)}45%{transform:translateY(-16px) scale(1.22) rotate(5deg);opacity:1;filter:brightness(1.9)}70%{transform:translateY(5px) scale(.97) rotate(-1deg);opacity:1}100%{transform:translateY(0) scale(1) rotate(0);opacity:1;filter:brightness(1)}}
.card.just-played::before{content:'';position:absolute;inset:-14px;border-radius:18px;background:radial-gradient(circle,var(--glow,#fff) 0%,transparent 65%);animation:br .8s ease-out forwards;pointer-events:none;z-index:-1}
@keyframes br{0%{transform:scale(.4);opacity:1}100%{transform:scale(2.4);opacity:0}}
.card.defendable,.card.transferable,.card.ready-attack{animation:gr 1.6s ease-in-out infinite}
@keyframes gr{0%,100%{box-shadow:0 4px 14px var(--glow,#0006),0 0 0 0 currentColor;transform:translateY(0)}50%{box-shadow:0 4px 14px var(--glow,#0006),0 0 20px 4px currentColor;transform:translateY(-4px)}}
.card.defendable{color:#2ecc71;border-color:#2ecc71}
.card.transferable{color:#3498db;border-color:#3498db}
.card.ready-attack{color:#ffd700;border-color:#ffd700}
.card.covered{opacity:.72;margin-top:-40px;z-index:1}
.card.covered::after{content:'✓';position:absolute;top:4px;right:8px;color:#2ecc71;font-size:24px;font-weight:bold;text-shadow:0 0 8px #000,0 0 12px #2ecc71;z-index:4;font-family:'Bangers',cursive}
.card.cover-card{z-index:3;border-color:#2ecc71;box-shadow:0 0 16px rgba(46,204,113,.85)}
.card-name{font-family:'Bangers',cursive;font-weight:normal;font-size:13px;text-align:center;color:#fff;min-height:24px;display:flex;align-items:center;justify-content:center;line-height:1;margin-bottom:3px;text-shadow:0 0 6px var(--c2,#000),2px 2px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000;letter-spacing:.8px}
.card.mini .card-name{font-size:11px;letter-spacing:.5px}
.attr-row{display:flex;justify-content:space-between;padding:3px 6px;border-radius:4px;margin-bottom:2px;font-size:10.5px;font-weight:700;transition:all .15s;font-family:'Oswald',sans-serif;letter-spacing:.3px}
.attr-row .attr-val{font-family:'Russo One',sans-serif;font-weight:bold;font-size:12px;text-shadow:0 0 6px currentColor,1px 1px 1px #000}
.attr-row.pickable{cursor:pointer}
.attr-row.pickable:hover{background:#ffd70066!important;transform:scale(1.05)}
.attr-row.highlight{box-shadow:inset 0 0 0 2px #ffd700,0 0 12px rgba(255,215,0,.75);animation:pl 1.2s infinite}

function beep(f,d,t,v){if(!soundEnabled||!audioCtx)return;try{var n=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=t||'sine';o.frequency.setValueAtTime(f,n);g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(v||0.07,n+0.01);g.gain.exponentialRampToValueAtTime(0.001,n+d);o.connect(g);g.connect(audioCtx.destination);o.start(n);o.stop(n+d+0.02)}catch(e){}}
function sweep(f1,f2,d,t,v){if(!soundEnabled||!audioCtx)return;try{var n=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=t||'sine';o.frequency.setValueAtTime(f1,n);o.frequency.exponentialRampToValueAtTime(f2,n+d);g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(v||0.08,n+0.01);g.gain.exponentialRampToValueAtTime(0.001,n+d);o.connect(g);g.connect(audioCtx.destination);o.start(n);o.stop(n+d+0.02)}catch(e){}}

function sendToHost(m){if(mode==='guest'&&conn&&conn.open)try{conn.send(m)}catch(e){}}
function handleGuestMessage(m){if(!m||!m.type)return;if(m.type==='attack'){if(state.turn!=='ai'||state.pile.length>0)return;var c=null;for(var i=0;i<state.aiHand.length;i++)if(state.aiHand[i].id===m.cardId)c=state.aiHand[i];if(!c)return;state.aiHand.splice(state.aiHand.indexOf(c),1);state.pile=[{card:c,attr:m.attr,value:c[m.attr],coveredBy:null}];state.lastPlayedId=c.id;state.turn='player';setMessages('🤖 Соперник ходит: '+attrName(m.attr)+' '+c[m.attr]+'.','Вы ходите.');play('attack');render()}else if(m.type==='respond'){if(state.turn!=='ai'||state.pile.length===0)return;var c2=null;for(var j=0;j<state.aiHand.length;j++)if(state.aiHand[j].id===m.cardId)c2=state.aiHand[j];if(c2)guestRespondAction(c2)}else if(m.type==='take'){if(state.turn!=='ai'||state.pile.length===0)return;var cs=[];for(var p=0;p<state.pile.length;p++){cs.push(state.pile[p].card);if(state.pile[p].coveredBy)cs.push(state.pile[p].coveredBy)}for(var q=0;q<cs.length;q++)state.aiHand.push(cs[q]);state.pile=[];state.lastPlayedId=null;refillHands();state.turn='player';setMessages('🤖 Соперник взял карты!','📥 Вы взяли.');play('take');render();if(checkEnd())return}else if(m.type==='bit'){if(state.phase==='awaitingBit')confirmBit()}else if(m.type==='chat'){addChatMessage('them',m.text);showEmotePop(m.text.length<=3?m.text:'💬')}else if(m.type==='emote'){showEmotePop(m.emoji);addChatMessage('them',m.emoji)}else if(m.type==='rematch'){rematch()}}
function handleHostMessage(m){if(!m||!m.type)return;if(m.type==='state'){state.playerHand=m.yourHand;state.aiHand=[];for(var i=0;i<m.oppHandCount;i++)state.aiHand.push({});state.deck=[];for(var j=0;j<m.deckCount;j++)state.deck.push({});state.discard=[];for(var k=0;k<m.discardCount;k++)state.discard.push({});state.pile=m.pile||[];state.turn=m.yourTurn?'player':'ai';state.phase=m.phase;state.message=m.message;state.lastPlayedId=m.lastPlayedId;state.bitWinner=(m.bitWinner==='ai')?'player':(m.bitWinner==='player'?'ai':null);render()}else if(m.type==='chat'){addChatMessage('them',m.text);showEmotePop(m.text.length<=3?m.text:'💬')}else if(m.type==='emote'){showEmotePop(m.emoji);addChatMessage('them',m.emoji)}}
function guestRespondAction(card){var pile=state.pile,latest=pile[pile.length-1];var cardIdx=state.aiHand.indexOf(card);if(cardIdx<0)return;var anyCovered=false;for(var i=0;i<pile.length;i++)if(pile[i].coveredBy)anyCovered=true;if(!anyCovered&&card[latest.attr]===latest.value){state.aiHand.splice(cardIdx,1);pile.push({card:card,attr:latest.attr,value:latest.value,coveredBy:null});state.lastPlayedId=card.id;state.turn='player';setMessages('🔁 Соперник перевёл!','🔁 Вы перевели!');play('transfer');flashScreen();render();return}var uncovered=[];for(var k=0;k<pile.length;k++)if(!pile[k].coveredBy)uncovered.push(pile[k]);for(var m=0;m<uncovered.length;m++){var entry=uncovered[m];if(card[entry.attr]>entry.value){state.aiHand.splice(cardIdx,1);entry.coveredBy=card;state.lastPlayedId=card.id;play('cover');var so=false;for(var n=0;n<pile.length;n++)if(!pile[n].coveredBy)so=true;if(!so){render();setTimeout(function(){requestBit('ai')},400)}else{var left=0;for(var q=0;q<pile.length;q++)if(!pile[q].coveredBy)left++;setMessages('Соперник отбил одну. Осталось: '+left,'✅ Отбили одну.');render()}return}}}
function playerAttack(card,attrKey){if(mode==='guest'){if(state.phase!=='play'||state.turn!=='player'||state.pile.length>0)return;play('click');sendToHost({type:'attack',cardId:card.id,attr:attrKey});return}if(state.phase!=='play'||state.turn!=='player'||state.pile.length>0)return;var idx=state.playerHand.indexOf(card);if(idx<0)return;state.playerHand.splice(idx,1);state.pile=[{card:card,attr:attrKey,value:card[attrKey],coveredBy:null}];state.lastPlayedId=card.id;state.turn='ai';setMessages('Вы ходите: '+attrName(attrKey)+' '+card[attrKey]+'.','🤖 Соперник ходит.');play('attack');stopTimer();render();if(mode==='ai')setTimeout(aiRespond,1300)}
function playerRespondWithCard(card){if(mode==='guest'){if(state.phase!=='play'||state.turn!=='player'||state.pile.length===0)return;play('click');sendToHost({type:'respond',cardId:card.id});return}if(state.phase!=='play'||state.turn!=='player'||state.pile.length===0)return;var pile=state.pile,latest=pile[pile.length-1];var cardIdx=state.playerHand.indexOf(card);if(cardIdx<0)return;var anyCovered=false;for(var i=0;i<pile.length;i++)if(pile[i].coveredBy)anyCovered=true;if(!anyCovered&&card[latest.attr]===latest.value){state.playerHand.splice(cardIdx,1);pile.push({card:card,attr:latest.attr,value:latest.value,coveredBy:null});state.lastPlayedId=card.id;state.turn='ai';setMessages('🔁 Вы перевели!','🔁 Соперник перевёл!');play('transfer');flashScreen();stopTimer();render();if(mode==='ai')setTimeout(aiRespond,1300);return}var uncovered=[];for(var k=0;k<pile.length;k++)if(!pile[k].coveredBy)uncovered.push(pile[k]);for(var m=0;m<uncovered.length;m++){var entry=uncovered[m];if(card[entry.attr]>entry.value){state.playerHand.splice(cardIdx,1);entry.coveredBy=card;state.lastPlayedId=card.id;play('cover');var so=false;for(var n=0;n<pile.length;n++)if(!pile[n].coveredBy)so=true;if(!so){render();setTimeout(function(){requestBit('player')},400)}else{var left=0;for(var q=0;q<pile.length;q++)if(!pile[q].coveredBy)left++;setMessages('✅ Отбили одну. Осталось: '+left,'✅ Соперник отбил одну.');render()}return}}setMessages('❌ Карта не подходит.','❌ Не подходит.');render()}
function playerTake(){if(mode==='guest'){if(state.phase==='play'&&state.turn==='player'&&state.pile.length>0){play('click');sendToHost({type:'take'})}return}if(state.phase!=='play'||state.turn!=='player'||state.pile.length===0)return;var cards=[];for(var i=0;i<state.pile.length;i++){cards.push(state.pile[i].card);if(state.pile[i].coveredBy)cards.push(state.pile[i].coveredBy)}for(var j=0;j<cards.length;j++)state.playerHand.push(cards[j]);state.pile=[];state.lastPlayedId=null;refillHands();state.turn='ai';setMessages('📥 Вы взяли карты. Ход соперника...','📥 Соперник взял.');play('take');stopTimer();render();if(checkEnd())return;if(mode==='ai')setTimeout(aiAttack,1300)}
function requestBit(whoCovered){state.phase='awaitingBit';state.bitWinner=whoCovered;if(whoCovered==='player')setMessages('✅ Вы отбились! Нажмите «Бито».','🤖 Соперник отбился.');else setMessages('🤖 Соперник отбился. Нажмите «Бито».','✅ Вы отбились! Нажмите «Бито».');render()}
function confirmBit(){if(mode==='guest'){if(state.phase==='awaitingBit'){play('click');sendToHost({type:'bit'})}return}if(state.phase!=='awaitingBit')return;var all=[];for(var i=0;i<state.pile.length;i++){all.push(state.pile[i].card);if(state.pile[i].coveredBy)all.push(state.pile[i].coveredBy)}for(var j=0;j<all.length;j++)state.discard.push(all[j]);state.pile=[];state.lastPlayedId=null;refillHands();var defender=state.bitWinner;state.bitWinner=null;state.phase='play';play('bit');flashScreen();render();if(checkEnd())return;if(defender==='player'){state.turn='player';setMessages('✅ Бито! Ваш ход.','✅ Бито! Ход соперника...');startTimerIfNeeded();render()}else{state.turn='ai';setMessages('✅ Бито! Ход соперника...','✅ Бито! Ваш ход.');render();if(mode==='ai')setTimeout(aiAttack,1300)}}
function aiAttack(){if(mode!=='ai')return;if(state.phase!=='play'||state.turn!=='ai'||state.pile.length>0)return;if(state.aiHand.length===0){endGame('player');return}var choice;if(Math.random()<0.7){var best=null;for(var i=0;i<state.aiHand.length;i++){var c=state.aiHand[i];for(var j=0;j<ATTRS.length;j++){var a=ATTRS[j];if(!best||c[a.key]>best.value)best={card:c,attr:a.key,value:c[a.key]}}}choice=best}else{var rc=state.aiHand[Math.floor(Math.random()*state.aiHand.length)];var ba=ATTRS[0].key,bv=rc[ATTRS[0].key];for(var k=1;k<ATTRS.length;k++)if(rc[ATTRS[k].key]>bv){bv=rc[ATTRS[k].key];ba=ATTRS[k].key}choice={card:rc,attr:ba,value:bv}}state.aiHand.splice(state.aiHand.indexOf(choice.card),1);state.pile=[{card:choice.card,attr:choice.attr,value:choice.value,coveredBy:null}];state.lastPlayedId=choice.card.id;state.turn='player';setMessages('🤖 Противник ходит: '+attrName(choice.attr)+' '+choice.value+'.','🤖 Соперник ходит.');play('attack');render()}
function aiRespond(){if(mode!=='ai')return;if(state.phase!=='play'||state.turn!=='ai'||state.pile.length===0)return;var pile=state.pile,latest=pile[pile.length-1];var anyCovered=false;for(var i=0;i<pile.length;i++)if(pile[i].coveredBy)anyCovered=true;if(!anyCovered&&Math.random()<0.35){for(var t=0;t<state.aiHand.length;t++){if(state.aiHand[t][latest.attr]===latest.value){var tc=state.aiHand.splice(t,1)[0];pile.push({card:tc,attr:latest.attr,value:latest.value,coveredBy:null});state.lastPlayedId=tc.id;state.turn='player';setMessages('🔁 Противник перевёл!','🔁 Противник перевёл!');play('transfer');flashScreen();render();return}}}var uncovered=[];for(var u=0;u<pile.length;u++)if(!pile[u].coveredBy)uncovered.push(pile[u]);var tmp=state.aiHand.slice(),covers=[],ok=true;for(var e=0;e<uncovered.length;e++){var entry=uncovered[e],bi=-1,bv=Infinity;for(var h=0;h<tmp.length;h++){var v=tmp[h][entry.attr];if(v>entry.value&&v<bv){bv=v;bi=h}}if(bi===-1){ok=false;break}covers.push({entry:entry,card:tmp[bi]});tmp.splice(bi,1)}if(ok&&covers.length>0){for(var c=0;c<covers.length;c++){var idx=state.aiHand.indexOf(covers[c].card);if(idx>=0)state.aiHand.splice(idx,1);covers[c].entry.coveredBy=covers[c].card}state.lastPlayedId=covers[covers.length-1].card.id;setMessages('🤖 Противник отбился.','🤖 Противник отбился.');play('cover');render();setTimeout(function(){requestBit('ai')},500);return}var cards=[];for(var p=0;p<pile.length;p++){cards.push(pile[p].card);if(pile[p].coveredBy)cards.push(pile[p].coveredBy)}for(var q=0;q<cards.length;q++)state.aiHand.push(cards[q]);state.pile=[];state.lastPlayedId=null;refillHands();state.turn='player';setMessages('🤖 Противник взял карты! Ваш ход.','🤖 Противник взял карты!');play('take');render();if(checkEnd())return}
function renderCard(card,opts){opts=opts||{};var theme=HERO_THEMES[card.name]||{c1:'#444',c2:'#888',icon:'❔',fx:'float'};var el=document.createElement('div');el.className='card fx-'+theme.fx;if(opts.mini)el.classList.add('mini');if(opts.extraClass)el.classList.add(opts.extraClass);if(opts.justPlayed)el.classList.add('just-played');if(card.img)el.classList.add('has-img');if(opts.noTilt)el.classList.add('no-tilt');el.style.setProperty('--c1',theme.c1);el.style.setProperty('--c2',theme.c2);el.style.setProperty('--glow',hexToRgba(theme.c2,0.55));var aura=document.createElement('div');aura.className='aura';el.appendChild(aura);var em=document.createElement('div');em.className='emblem';em.textContent=theme.icon;el.appendChild(em);if(!opts.noZoom){var zoom=document.createElement('div');zoom.className='card-zoom';zoom.textContent='🔍';zoom.onclick=function(ev){ev.stopPropagation();openCardModal(card)};el.appendChild(zoom)}if(card.img){var img=document.createElement('div');img.className='card-img';img.style.backgroundImage='url("'+card.img+'")';el.appendChild(img)}var nm=document.createElement('div');nm.className='card-name';nm.textContent=card.name;el.appendChild(nm);for(var i=0;i<ATTRS.length;i++)(function(a){var row=document.createElement('div');row.className='attr-row';row.style.background=a.color+'40';var n=document.createElement('span');n.textContent=a.icon+' '+a.short;row.appendChild(n);var v=document.createElement('span');v.className='attr-val';v.textContent=card[a.key];row.appendChild(v);if(opts.highlightAttr===a.key)row.classList.add('highlight');if(opts.pickableAttr){row.classList.add('pickable');row.onclick=function(ev){ev.stopPropagation();opts.pickableAttr(a.key)}}el.appendChild(row)})(ATTRS[i]);el.onclick=function(ev){if(ev.target.closest&&(ev.target.closest('.attr-row.pickable')||ev.target.closest('.card-zoom')))return;if(opts.onClick)opts.onClick(card);else openCardModal(card)};return el}
function applyFan(container,cards){var count=cards.length;var els=container.querySelectorAll('.card');for(var i=0;i<els.length;i++){var mid=(count-1)/2,offset=i-mid;els[i].style.transform='rotate('+(offset*2.2)+'deg) translateY('+(Math.abs(offset)*3)+'px)';els[i].style.zIndex=10+i}}
function render(){document.getElementById('aiCount').textContent=state.aiHand.length;document.getElementById('deckCount').textContent=state.deck.length;document.getElementById('discardCount').textContent=state.discard.length;document.getElementById('myCount').textContent=state.playerHand.length;var db=document.getElementById('deckBig');if(db)db.textContent=state.deck.length;var dg=document.getElementById('discardBig');if(dg)dg.textContent=state.discard.length;var dv=document.getElementById('deckVisual');if(dv){if(state.deck.length===0)dv.classList.add('empty');else dv.classList.remove('empty');var d1=dv.querySelector('.d1'),d2=dv.querySelector('.d2'),d3=dv.querySelector('.d3'),d4=dv.querySelector('.d4');if(d1)d1.style.display=state.deck.length>1?'':'none';if(d2)d2.style.display=state.deck.length>3?'':'none';if(d3)d3.style.display=state.deck.length>6?'':'none';if(d4)d4.style.display=state.deck.length>10?'':'none'}var ti=document.getElementById('turnIndicator');if(ti&&state.phase==='play'){ti.classList.remove('hidden');if(state.turn==='player'){ti.className='my';ti.textContent='ТВОЙ ХОД'}else{ti.className='enemy';ti.textContent='ХОД СОПЕРНИКА'}}else if(ti)ti.classList.add('hidden');var eInf=document.getElementById('enemyInfo'),mInf=document.getElementById('myInfo');if(eInf&&mInf&&state.phase==='play'){if(state.turn==='ai'){eInf.classList.add('active');mInf.classList.remove('active')}else{mInf.classList.add('active');eInf.classList.remove('active')}}var aiH=document.getElementById('aiHand');aiH.innerHTML='';for(var i=0;i<state.aiHand.length;i++){var b=document.createElement('div');b.className='card back mini no-tilt';b.textContent='★';var mid=(state.aiHand.length-1)/2,off=i-mid;b.style.transform='rotate('+(off*2)+'deg) translateY('+(Math.abs(off)*2)+'px)';b.style.zIndex=10+i;aiH.appendChild(b)}var tE=document.getElementById('pileCards');tE.innerHTML='';if(state.pile.length===0){var ph=document.createElement('div');ph.className='pile-placeholder';ph.textContent='СТОЛ ПУСТ';tE.appendChild(ph)}else{for(var j=0;j<state.pile.length;j++)(function(entry){var stack=document.createElement('div');stack.className='pile-stack';if(entry.coveredBy){var cov=renderCard(entry.coveredBy,{extraClass:'cover-card',justPlayed:entry.coveredBy.id===state.lastPlayedId,noTilt:true});stack.appendChild(cov)}var base=renderCard(entry.card,{highlightAttr:entry.attr,justPlayed:entry.card.id===state.lastPlayedId,noTilt:true});if(entry.coveredBy)base.classList.add('covered');stack.appendChild(base);tE.appendChild(stack)})(state.pile[j])}document.getElementById('message').textContent=state.message;var aE=document.getElementById('actions');aE.innerHTML='';if(state.phase==='play'&&state.turn==='player'&&state.pile.length>0){var tb=document.createElement('button');tb.className='btn take';tb.textContent='📥 Взять карты';tb.onclick=function(){play('click');playerTake()};aE.appendChild(tb)}if(state.phase==='awaitingBit'&&(mode!=='guest'||state.bitWinner==='player')){var bb=document.createElement('button');bb.className='btn bit';bb.textContent='✋ Бито!';bb.onclick=function(){play('click');confirmBit()};aE.appendChild(bb)}var pH=document.getElementById('playerHand');pH.innerHTML='';for(var k=0;k<state.playerHand.length;k++)(function(card){var ec='',oc=null,pa=null;if(state.phase==='play'&&state.turn==='player'){if(state.pile.length===0){ec='ready-attack';pa=function(a){play('click');playerAttack(card,a)}}else{var latest=state.pile[state.pile.length-1];var anyC=false;for(var z=0;z<state.pile.length;z++)if(state.pile[z].coveredBy)anyC=true;if(!anyC&&card[latest.attr]===latest.value){ec='transferable';oc=function(c){play('click');playerRespondWithCard(c)}}else{var canCover=false;for(var y=0;y<state.pile.length;y++){var entry=state.pile[y];if(!entry.coveredBy&&card[entry.attr]>entry.value){canCover=true;break}}if(canCover){ec='defendable';oc=function(c){play('click');playerRespondWithCard(c)}}}}}var el=renderCard(card,{extraClass:ec,onClick:oc,pickableAttr:pa,noTilt:true});pH.appendChild(el)})(state.playerHand[k]);applyFan(pH,state.playerHand);if(mode==='host')syncToGuest()}
function toggleChat(){var p=document.getElementById('chatPanel');p.classList.toggle('visible');if(p.classList.contains('visible'))document.getElementById('chatInput').focus();if(!p.dataset.init){initQuickBar();p.dataset.init='1'}}
function initQuickBar(){var phrases=['Хороший ход!','Сдавайся!','Удачи!','Красава!','Ого!','Реванш?'];var qb=document.getElementById('quickBar');qb.innerHTML='';phrases.forEach(function(p){var b=document.createElement('button');b.textContent=p;b.onclick=function(){sendChat(p)};qb.appendChild(b)})}
function sendChat(text){var t=text||(document.getElementById('chatInput').value||'').trim();if(!t)return;document.getElementById('chatInput').value='';addChatMessage('me',t);if(mode==='host'&&conn&&conn.open)conn.send({type:'chat',text:t});else if(mode==='guest')sendToHost({type:'chat',text:t});showEmotePop(t.length<=3?t:'💬')}
function addChatMessage(who,text){var b=document.getElementById('chatBody');var m=document.createElement('div');m.className='chat-msg '+who;var w=document.createElement('span');w.className='who';w.textContent=who==='me'?'Вы:':'Соперник:';m.appendChild(w);m.appendChild(document.createTextNode(text));b.appendChild(m);b.scrollTop=b.scrollHeight}
function toggleEmoji(){var p=document.getElementById('emojiPanel');p.classList.toggle('visible');if(!p.dataset.init){var emojis=['😂','😎','🔥','💪','🤣','😱','👍','👎','🎉','🤔','😡','🥶','💀','👑','⚡','🎯','❤️','🙈'];emojis.forEach(function(e){var b=document.createElement('button');b.textContent=e;b.onclick=function(){showEmotePop(e);addChatMessage('me',e);if(mode==='host'&&conn&&conn.open)conn.send({type:'emote',emoji:e});else if(mode==='guest')sendToHost({type:'emote',emoji:e})};p.appendChild(b)});p.dataset.init='1'}}
document.addEventListener('click',initAudio,{once:true});
applySettingsToUI();
resetState();
updateStatsBar();
render();
(function(){try{var params=new URLSearchParams(window.location.search);var code=params.get('room');if(code&&code.length===5)setTimeout(function(){showJoinRoom(code.toUpperCase())},200)}catch(e){}})();
</script>
